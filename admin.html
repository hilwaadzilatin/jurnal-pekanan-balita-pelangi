<!DOCTYPE html>
<html lang="id">

<head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Jurnal Pekanan Balita Pelangi</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6f4;
    color: #333;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 20px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    margin: 0;
    color: #47745f;
}

.header p {
    color: #777;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.07);
}

.login {
    max-width: 400px;
    margin: 80px auto;
}

.logo {
    width: 75px;
    height: 75px;
    object-fit: contain;
    display: block;
    margin: 0 auto 10px;
}

h2 {
    color: #47745f;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

input,
select {
    width: 100%;
    padding: 11px;
    border: 1px solid #d9dedb;
    border-radius: 9px;
    font-size: 14px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.login-button {
    width: 100%;
    margin-top: 18px;
    background: #47745f;
    color: white;
}

.error {
    color: #a04444;
    background: #f9e8e8;
    padding: 10px;
    border-radius: 8px;
    margin-top: 12px;
    display: none;
}

.top-bar {
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.search {
    flex: 1;
    min-width: 220px;
}

.logout {
    background: #f7e5e5;
    color: #a04444;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #888;
}

.history-item {
    border: 1px solid #e0e5e2;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
}

.history-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
}

.student-name {
    font-weight: bold;
    color: #47745f;
    font-size: 17px;
}

.meta {
    margin-top: 7px;
    font-size: 13px;
    color: #666;
}

.actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
}

.view {
    background: #edf4ef;
    color: #47745f;
}

.delete {
    background: #f7e5e5;
    color: #a04444;
}

.detail {
    margin-top: 15px;
    padding: 15px;
    background: #f8faf9;
    border-radius: 10px;
    display: none;
}

.detail table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 12px;
    background: white;
}

.detail th,
.detail td {
    border: 1px solid #ccc;
    padding: 8px;
    vertical-align: top;
    text-align: left;
}

.detail th {
    background: #eaf2ed;
    color: #47745f;
}

@media(max-width:600px) {
    .container {
        padding: 20px 12px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->
<div class="container" id="loginPage">
    <div class="card login">
        <img src="logo.png" class="logo">
        <h2 style="text-align:center;">🔐 Admin Jurnal</h2>
        <p style="text-align:center; color:#777; font-size:13px;">Balita Pelangi</p>

        <label>Password Admin</label>
        <div style="display:flex; gap:8px; align-items:center;">
            <input type="password" id="password" placeholder="Masukkan password" style="flex:1;">
            <button type="button" onclick="togglePassword()" style="width:auto; margin:0; padding:11px 13px; background:#edf4ef; color:#47745f;" id="togglePasswordButton">👁️</button>
        </div>

        <div class="error" id="loginError">Password salah.</div>
        <button class="login-button" onclick="login()">Masuk</button>
    </div>
</div>

<!-- =====================================================
     ADMIN PAGE
===================================================== -->
<div class="container" id="adminPage" style="display:none;">
    <div class="header">
        <h1>🌈 Admin Jurnal Pekanan</h1>
        <p>Balita Pelangi</p>
    </div>

    <div class="card">
        <div class="top-bar">
            <button onclick="exportToCSV()" style="background:#e6f4ea; color:#137333; border:none; padding:11px 16px; border-radius:9px; cursor:pointer; font-weight:bold;">
                📊 Export Excel
            </button>
            <input class="search" type="text" id="search" placeholder="🔎 Cari nama siswa..." oninput="renderHistory()"/>
            <button class="logout" onclick="logout()">Keluar</button>
        </div>

        <div id="historyContainer"></div>
    </div>
</div>

<script>

const SUPABASE_URL = "https://ccaqawnzcslawxptfrim.supabase.co/";
const SUPABASE_KEY = "sb_publishable_VuHOjypMkadY-OpcD9L0sQ_bPgdp7kg";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function exportToCSV() {

    try {

        // Ambil semua data langsung dari Supabase
        const { data: historyData, error } =
            await supabaseClient
                .from("jurnal_balita_pelangi")
                .select("*")
                .order("id", { ascending: false });


        if (error) {

            console.error(
                "Supabase export error:",
                error
            );

            alert(
                "❌ Gagal mengambil data dari Supabase.\n\n" +
                error.message
            );

            return;
        }


        if (
            !historyData ||
            historyData.length === 0
        ) {

            alert(
                "Belum ada data jurnal di Supabase."
            );

            return;
        }


        let csvContent =
            "data:text/csv;charset=utf-8,";


        csvContent +=
            "No,Nama Siswa,Layanan,Kelas,Pekan,Periode,Tanggal,Rincian Kegiatan,Catatan Guru\n";


        historyData.forEach(
            (item, index) => {

                // =================================================
                // GABUNGKAN KEGIATAN
                // =================================================

                let activitiesText = "";

                if (
                    Array.isArray(
                        item.activities
                    )
                ) {

                    activitiesText =
                        item.activities
                            .map(
                                activity =>
                                    `${activity.element || "-"}: ${activity.activity || "-"}`
                            )
                            .join(" | ");

                }


                // =================================================
                // DATA BARIS
                // =================================================

                const row = [

                    index + 1,

                    `"${String(
                        item.nama || ""
                    ).replace(
                        /"/g,
                        '""'
                    )}"`,

                    `"${String(
                        item.jenis || ""
                    ).replace(
                        /"/g,
                        '""'
                    )}"`,

                    `"${String(
                        item.kelas || ""
                    ).replace(
                        /"/g,
                        '""'
                    )}"`,

                    `"${String(
                        item.pekan || "-"
                    ).replace(
                        /"/g,
                        '""'
                    )}"`,

                    `"${String(
                        item.periode || ""
                    ).replace(
                        /"/g,
                        '""'
                    )}"`,

                    `"${String(
                        item.tanggal || "-"
                    ).replace(
                        /"/g,
                        '""'
                    )}"`,

                    `"${activitiesText.replace(
                        /"/g,
                        '""'
                    )}"`,

                    `"${String(
                        item.catatan || ""
                    )
                        .replace(
                            /"/g,
                            '""'
                        )
                        .replace(
                            /\n/g,
                            " "
                        )}"`

                ];


                csvContent +=
                    row.join(",") +
                    "\n";

            }
        );


        // =================================================
        // DOWNLOAD CSV
        // =================================================

        const encodedUri =
            encodeURI(csvContent);


        const link =
            document.createElement("a");


        link.setAttribute(
            "href",
            encodedUri
        );


        link.setAttribute(
            "download",
            `Rekap_Jurnal_BalitaPelangi_${new Date()
                .toISOString()
                .slice(0, 10)}.csv`
        );


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        alert(
            "✅ Data jurnal berhasil diexport dari Supabase."
        );


    }

    catch (error) {

        console.error(error);

        alert(
            "❌ Terjadi kesalahan saat export.\n\n" +
            error.message
        );

    }

}

/* =====================================================
   PASSWORD ADMIN
===================================================== */
const ADMIN_PASSWORD = "bapel123";

/* =====================================================
   LOGIN & LOGOUT
===================================================== */
function login() {
    const password = document.getElementById("password").value;

    if (password === ADMIN_PASSWORD) {
        sessionStorage.setItem("adminLogin", "true");
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("adminPage").style.display = "block";
        renderHistory();
    } else {
        document.getElementById("loginError").style.display = "block";
    }
}

function logout() {
    sessionStorage.removeItem("adminLogin");
    location.reload();
}

function togglePassword() {
    const password = document.getElementById("password");
    const button = document.getElementById("togglePasswordButton");

    if (password.type === "password") {
        password.type = "text";
        button.textContent = "🙈";
    } else {
        password.type = "password";
        button.textContent = "👁️";
    }
}

/* =====================================================
   RENDER HISTORY (DENGAN TABEL KEGIATAN)
===================================================== */

async function renderHistory() {
    const container = document.getElementById("historyContainer");
    const search = document.getElementById("search").value.toLowerCase().trim();

    const { data: historyData, error } =
    await supabaseClient
        .from("jurnal_balita_pelangi")
        .select("*")
        .order("id", { ascending: false });

if (error) {
    console.error("Supabase error:", error);

    container.innerHTML = `
        <div class="empty" style="color:#a04444;">
            ❌ Gagal mengambil data jurnal.<br>
            ${escapeHTML(error.message)}
        </div>
    `;

    return;
}

    // Filter berdasarkan pencarian nama
    const filtered = historyData.filter(item =>
        (item.nama || "").toLowerCase().includes(search)
    );

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty">
                Belum ada riwayat jurnal yang diunduh.
            </div>
        `;
        return;
    }

    container.innerHTML = "";

    filtered.forEach((item, index) => {
        const div = document.createElement("div");
        div.className = "history-item";

        // =====================================================
        // SUSUN BARIS TABEL KEGIATAN
        // =====================================================

        let tableRowsHTML = "";

        if (
            Array.isArray(item.activities) &&
            item.activities.length > 0
        ) {
            item.activities.forEach((act, actIdx) => {

                tableRowsHTML += `
                    <tr>
                        <td style="width: 30px; text-align: center;">
                            ${actIdx + 1}
                        </td>

                        <td style="width: 35%;">
                            <b>
                                ${escapeHTML(
                                    act.element || "-"
                                )}
                            </b>
                        </td>

                        <td>
                            ${escapeHTML(
                                act.activity || "-"
                            )}
                        </td>
                    </tr>
                `;

            });
        } else {

            tableRowsHTML = `
                <tr>
                    <td
                        colspan="3"
                        style="
                            text-align:center;
                            color:#888;
                        "
                    >
                        Tidak ada rincian kegiatan tersimpan.
                    </td>
                </tr>
            `;

        }


        // =====================================================
        // CARD RIWAYAT
        // =====================================================

        div.innerHTML = `
            <div class="history-header">

                <div>

                    <div class="student-name">
                        ${escapeHTML(
                            item.nama || "-"
                        )}
                    </div>

                    <div class="meta">

                        ${escapeHTML(
                            item.jenis || "TK"
                        )}

                        ·

                        Kelas:
                        ${escapeHTML(
                            item.kelas || "-"
                        )}

                        ·

                        Pekan
                        ${escapeHTML(
                            item.pekan || "-"
                        )}

                        ·

                        ${escapeHTML(
                            item.periode || "-"
                        )}

                        ·

                        <span style="
                            color:#47745f;
                            font-weight:bold;
                        ">
                            Unduh:
                            ${escapeHTML(
                                item.tanggal || "-"
                            )}
                        </span>

                    </div>

                </div>

            </div>


            <div class="actions">

                <button
                    class="view"
                    onclick="toggleDetail(${index})"
                >
                    👀 Lihat Detail & Tabel
                </button>


                <button
                    class="delete"
                    onclick="deleteHistory(${item.id})"
                >
                    🗑️ Hapus
                </button>

            </div>


            <div
                class="detail"
                id="detail-${index}"
            >

                <p style="
                    margin-top:0;
                    font-weight:bold;
                    color:#47745f;
                ">
                    📋 Rincian Kegiatan Pekanan:
                </p>


                <table>

                    <thead>

                        <tr>

                            <th style="
                                width:30px;
                                text-align:center;
                            ">
                                No
                            </th>

                            <th>
                                Elemen CP
                            </th>

                            <th>
                                Kegiatan Utama
                            </th>

                        </tr>

                    </thead>


                    <tbody>

                        ${tableRowsHTML}

                    </tbody>

                </table>


                <p style="
                    margin-bottom:5px;
                    font-weight:bold;
                    color:#47745f;
                ">
                    📝 Catatan Guru / Perkembangan:
                </p>


                <p style="
                    background:white;
                    padding:10px;
                    border-radius:6px;
                    border:1px solid #e0e5e2;
                    margin:0;
                ">
                    ${escapeHTML(
                        item.catatan ||
                        "Tidak ada catatan."
                    )}
                </p>

            </div>
        `;

        container.appendChild(div);
    });
}

/* =====================================================
   DETAIL & DELETE
===================================================== */
function toggleDetail(index) {
    const detail = document.getElementById("detail-" + index);
    if (detail.style.display === "block") {
        detail.style.display = "none";
    } else {
        detail.style.display = "block";
    }
}

function deleteHistory(id) {
    const confirmed = confirm("Yakin ingin menghapus riwayat jurnal ini?");
    if (!confirmed) return;

    const HISTORY_KEY = "balitaPelangi_jurnalHistory";
    let historyData = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");

    historyData = historyData.filter(item => item.id !== id);

    localStorage.setItem(HISTORY_KEY, JSON.stringify(historyData));
    renderHistory();
}

/* =====================================================
   ESCAPE HTML
===================================================== */
function escapeHTML(text) {
    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =====================================================
   AUTO CEK LOGIN SAAT HALAMAN DIBUKA
===================================================== */
if (sessionStorage.getItem("adminLogin") === "true") {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("adminPage").style.display = "block";
    renderHistory();
}
</script>

</body>
</html>
